<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firewatch dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
<!-- CesiumJS (3D map), pinned version. To upgrade, change 1.146.0 in BOTH lines. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Widgets/widgets.css">
<script src="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Cesium.js"></script>
<!-- Your Cesium ion token. config.js is git-ignored; copy config.example.js to create it. -->
<script src="config.js"></script>
<style>
  :root {
    --bg: #15120F;
    --map: #1B1814;
    --panel: #221E19;
    --panel-2: #26211C;
    --line: #3A332B;
    --line-soft: #332D26;
    --text: #EDE3CF;
    --text-2: #D9CFBC;
    --muted: #A89C88;
    --dim: #8A7F70;
    --fire: #F26B2E;
    --fire-soft: #F2A65A;
    --warn: #C2410C;
    --water: #6EA8D6;
    --water-text: #9CC4E4;
    --break: #E8B04A;
    --power: #C9B98F;
    --calm: #8FA9C2;      /* gray-blue: negative points, "no fire" outcomes */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { color: var(--text); font-family: 'Barlow', system-ui, sans-serif; font-size: 15px; line-height: 1.35; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--fire-soft); outline-offset: 2px; }
  ul { list-style: none; margin: 0; padding: 0; }
  .num { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; }
  .muted { color: var(--muted); }

  .app { height: 100vh; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 8px; padding: 0 10px 10px; }

  header { display: flex; align-items: center; gap: 22px; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand b { font-weight: 600; font-size: 18px; }
  /* District name shortens with … when the header is full (narrower screens). */
  .brand { min-width: 0; }
  .brand > .muted { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .modes { display: flex; border: 1px solid #5A5047; }
  .modes button { min-height: 32px; padding: 4px 16px; border: none; background: transparent; color: var(--text); font-size: 14px; font-weight: 600; }
  .modes button.on { background: var(--text); color: #1B1814; }
  .flag { font-size: 13px; font-weight: 600; background: var(--warn); color: #fff; padding: 3px 10px; }
  .badge-neutral { font-size: 13px; font-weight: 600; background: #4A4238; color: var(--text); padding: 3px 10px; }
  .scenario { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .scenario select { min-height: 32px; padding: 2px 8px; background: var(--panel); color: var(--text); border: 1px solid #5A5047; font: 600 14px 'Barlow', sans-serif; cursor: pointer; }
  .conditions { display: flex; align-items: center; gap: 22px; flex: 1 1 auto; min-width: 0; }
  /* Badge + day note; the note shortens with … when the header is full. */
  .condday { display: flex; align-items: center; gap: 10px; flex: 0 1 auto; min-width: 0; }
  .condday > span:first-child { flex: none; }
  .condnote { font-size: 13px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .weather { display: flex; flex: none; gap: 20px; margin-left: auto; font-size: 14px; }
  .weather b { font-weight: 600; }

  .tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--line); padding: 6px 12px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .tile .tl { font-size: 14px; color: var(--text-2); }
  .tile .tv { font-size: 38px; line-height: 1.05; }
  .tile .tv span { font-size: 18px; }
  .tile .tn { font-size: 12px; color: var(--muted); }

  .body { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .body.full { grid-template-columns: 340px minmax(0, 1fr); }

  aside[hidden] { display: none; }
  aside { min-height: 0; overflow: hidden; background: var(--panel); border: 1px solid var(--line); display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
  .status { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .status h2 { margin: 0; font-size: 18px; font-weight: 600; text-align: center; }
  .ringrow { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
  .ring { position: relative; flex: 0 0 auto; }
  .ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .center small { font-size: 11px; color: var(--muted); }
  .reasons { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .reasons li { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
  .reasons li b { font-weight: 600; }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center; }
  .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .facts div div:first-child { font-size: 12px; color: var(--muted); }
  .facts div div:last-child { font-weight: 600; font-size: 14px; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .actions button { flex: 1 1 0; min-height: 36px; font-size: 13px; font-weight: 600; }
  .btn-light { background: var(--text); color: #1B1814; border: none; }
  .btn-ghost { background: none; color: var(--text); border: 1px solid #5A5047; }
  .action-msg { margin-top: 6px; font-size: 12px; color: var(--fire-soft); }
  /* Planned-burn rule check under the confidence ring. */
  .rulecheck { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 12px; font-weight: 600; }
  .rulecheck .ok { color: var(--calm); }
  .rulecheck .bad { color: var(--fire); }
  /* Text message shown in the Alerts tab (confirm request, auto-reply). */
  .smsnote { padding: 8px 16px; font-size: 12px; }
  .smsbox { margin-top: 4px; padding: 7px 10px; background: var(--text); color: #1B1814; font-size: 13px; line-height: 1.4; }
  .burnbadge { margin-left: 6px; padding: 1px 6px; font-size: 11px; font-weight: 600; }
  .burnbadge.calm { background: rgba(143, 169, 194, 0.2); color: var(--calm); }
  .burnbadge.fire { background: rgba(242, 107, 46, 0.2); color: var(--fire-soft); }
  .burnrules { margin: 8px 16px; padding: 7px 10px; border-left: 3px solid var(--calm); font-size: 12px; color: var(--text-2); }
  .burnrules b { font-weight: 600; color: var(--text); }

  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1 1 auto; min-height: 38px; padding: 0 6px; background: none; border: none; border-bottom: 3px solid transparent; color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .tabs button.on { border-bottom-color: var(--fire); color: var(--text); }
  .tabbody { min-height: 0; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 10px; padding: 7px 16px; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
  .row .dot { width: 10px; height: 10px; border-radius: 5px; flex: 0 0 auto; }
  .row .who { flex: 1 1 auto; font-weight: 600; }
  .tabintro { font-size: 12px; color: var(--muted); padding: 7px 16px; }
  .burn { padding: 8px 16px; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
  .burn div:first-child { font-weight: 600; }
  .burn div:last-child { font-size: 12px; color: var(--muted); }

  .mapwrap { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; border: 1px solid var(--line); overflow: hidden; background: var(--map); }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .chip { min-height: 30px; padding: 3px 12px; border-radius: 15px; border: 1px solid #5A5047; background: var(--map); color: var(--text); font-size: 13px; font-weight: 500; white-space: nowrap; }
  .chip.on { background: var(--text); color: #1B1814; border-color: var(--text); }
  /* Fills the space left on the toolbar's row; shortens with … instead of wrapping to a new row. */
  /* Fills the space left on the toolbar's row; shortens with … instead of wrapping. */
  .sim { flex: 1 1 0; min-width: 70px; text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .datanote { margin: 8px 16px 0; font-size: 12px; color: var(--muted); }
  /* Info card for a GOES pixel / FIRMS hotspot (hover or click on the map). */
  .satinfo { position: absolute; z-index: 4; max-width: 360px; padding: 6px 10px; background: rgba(21, 18, 15, 0.95); border: 1px solid var(--line);
    font-size: 12px; color: var(--text); pointer-events: none; white-space: normal; }
  .satinfo[hidden] { display: none; }

  /* Map text (created by map3d.js): callout cards with leader lines, and small labels. */
  .maplabels { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .maplabels svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .maplabels .leader { stroke-width: 1.25; }
  .maplabels .leader.orange { stroke: var(--fire); }
  .maplabels .leader.cream { stroke: var(--text); }
  .maplabels .leaderdot.orange { fill: var(--fire); }
  .maplabels .leaderdot.cream { fill: var(--text); }
  .callout, .maptag { position: absolute; left: 0; top: 0; display: none; white-space: nowrap; will-change: transform; }
  .callout { padding: 6px 12px 7px; line-height: 1.25; color: #1B1814;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
  .callout b { display: block; font-size: 14px; font-weight: 600; }
  .callout span { display: block; font-size: 12px; opacity: 0.8; }
  .callout.orange { background: var(--fire); }
  .callout.cream { background: var(--text); }
  .maptag { padding: 1px 6px; font-size: 11.5px; font-weight: 500; line-height: 1.4; background: rgba(21, 18, 15, 0.82); color: var(--text-2); }
  .maptag.fire { color: var(--fire-soft); }
  .maptag.brk { color: var(--break); }
  .maptag.water { color: var(--water-text); }
  .maptag.power { color: var(--power); }
  .maptag.muted { color: var(--muted); }

  .map { position: relative; min-height: 0; overflow: hidden; background: var(--map); }
  /* The Cesium viewer lives here. It is created once and never re-rendered. */
  #cesiumContainer { position: absolute; inset: 0; }
  #cesiumContainer .cesium-viewer, #cesiumContainer .cesium-widget { width: 100%; height: 100%; }

  /* Required Cesium / data credits, kept small in the bottom-left corner. */
  .credits { position: absolute; left: 8px; bottom: 6px; z-index: 2; max-width: 70%; padding: 2px 6px; background: rgba(21, 18, 15, 0.6); font-size: 10px; line-height: 1.3; color: var(--muted); }
  .credits img { max-height: 18px; vertical-align: middle; }
  .credits a { color: var(--muted); }

  .resetview { position: absolute; top: 10px; right: 10px; z-index: 2; min-height: 30px; padding: 3px 12px; background: rgba(34, 30, 25, 0.92); color: var(--text); border: 1px solid #5A5047; font-size: 13px; font-weight: 600; }
  .resetview:hover { border-color: var(--text); }

  /* Wind compass card, bottom right (credits are bottom left, so they never overlap). */
  .windcard { position: absolute; right: 10px; bottom: 10px; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; background: rgba(34, 30, 25, 0.92); border: 1px solid var(--line); font-size: 13px; line-height: 1.3; color: var(--text-2); pointer-events: none; }
  .windcard[hidden] { display: none; }
  .windcard b { font-weight: 600; color: var(--text); }

  /* Message shown instead of a blank map (missing token, loading, errors). */
  .mapmsg { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 20px; text-align: center; background: var(--map); }
  .mapmsg[hidden] { display: none; }
  .mapmsg-title { font-size: 18px; font-weight: 600; color: var(--fire-soft); }
  .mapmsg.loading .mapmsg-title { color: var(--muted); font-weight: 500; }
  .mapmsg-detail { max-width: 460px; font-size: 13px; color: var(--muted); }
  .mapmsg code { color: var(--text); }

  .confcard { position: absolute; z-index: 2; top: 12px; left: 12px; width: 270px; background: rgba(34, 30, 25, 0.95); border: 1px solid var(--line); padding: 12px 14px; }
  .confcard h2 { margin: 0; font-size: 17px; font-weight: 600; }
  /* End-of-scenario outcome card (top center of the map). */
  .outcome { position: absolute; z-index: 2; top: 12px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 24px); padding: 10px 18px; text-align: center;
    background: rgba(34, 30, 25, 0.95); border: 1px solid var(--line); border-top: 4px solid var(--calm); }
  .outcome-title { font-size: 16px; font-weight: 600; }
  .outcome-sub { margin-top: 2px; font-size: 12px; color: var(--muted); }

  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 20px; padding: 6px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-2); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { display: inline-block; }

  footer { background: var(--panel); border-top: 1px solid var(--line); padding: 10px 16px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 22px; align-items: center; }
  .ctlcol { display: flex; flex-direction: column; gap: 6px; }
  .controls { display: flex; gap: 6px; }
  /* "Co-op power data" on/off switch (Real fire only). */
  .pswitch { display: flex; align-items: center; gap: 7px; padding: 0; background: none; border: none; color: var(--text-2); font-size: 12px; }
  .pswitch b { font-weight: 600; color: var(--text); }
  .pswitch-track { position: relative; width: 26px; height: 14px; border-radius: 7px; background: #4A4238; transition: background 0.15s; }
  .pswitch-knob { position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 5px; background: var(--text); transition: left 0.15s; }
  .pswitch.on .pswitch-track { background: var(--fire); }
  .pswitch.on .pswitch-knob { left: 14px; }
  .controls button { min-height: 38px; min-width: 60px; background: var(--panel-2); color: var(--text); border: 1px solid #4A4238; font-size: 14px; font-weight: 600; }
  .controls button.play { min-width: 74px; background: var(--fire); color: #1B1814; border: none; }
  .steps { display: flex; gap: 4px; margin-bottom: 4px; }
  .steps button { flex: 1 1 0; min-width: 0; min-height: 24px; padding: 0; border: none; border-top: 3px solid var(--line); background: none; color: var(--muted); font-size: 12px; font-weight: 600; }
  .steps button.done { border-top-color: #7A4A2E; }
  .steps button.on { border-top-color: var(--fire); color: var(--text); }
  /* Up to 3 lines (some scenario captions are long), then … */
  .caption { font-size: 14px; font-weight: 500; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .offnote { font-size: 12px; color: var(--calm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .real { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .compare { display: grid; grid-template-columns: auto auto auto; gap: 1px 14px; align-items: baseline; font-size: 13px; padding-left: 18px; border-left: 1px solid var(--line); }
  .compare span { max-width: 150px; }
  .body.full .compare { font-size: 12px; }

  .overlay { position: absolute; inset: 0; z-index: 5; background: rgba(14, 12, 10, 0.6); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .alert { width: 100%; max-width: 420px; background: var(--panel-2); border: 1px solid #4A4238; border-top: 6px solid var(--fire); padding: 16px 22px; }
  .alert .sms { margin-top: 10px; background: var(--text); color: #1B1814; padding: 12px 16px; font-size: 15px; line-height: 1.5; }
  .alert button { margin-top: 12px; min-height: 44px; width: 100%; background: var(--fire); color: #1B1814; border: none; font-size: 15px; font-weight: 600; }

  /* Calculator tab. The budget calculator is a separate static app shown in an
     iframe, so its own CSS and JS never touch the dashboard. The map is only
     hidden (never re-created) while this view is open. */
  .calcview { display: none; min-height: 0; grid-template-rows: auto minmax(0, 1fr); border: 1px solid var(--line); background: var(--bg); }
  .app.calc { grid-template-rows: auto minmax(0, 1fr); }
  .app.calc .calcview { display: grid; }
  .app.calc #tiles, .app.calc #body, .app.calc .scenario, .app.calc #conditions { display: none; }
  .calcbar { display: flex; align-items: center; gap: 12px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .calcbar b { font-size: 15px; font-weight: 600; }
  .calcbar .btn-ghost { margin-left: auto; min-height: 30px; padding: 3px 12px; font-size: 13px; font-weight: 600; }
  .calcbar .btn-ghost:hover { border-color: var(--text); }
  .calcframe { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }
  @media (max-width: 700px) { .app.calc .brand .muted { display: none; } }
</style>
</head>
<body>
<!--
  Page layout. The parts with an id="..." are re-filled by render() on every
  state change. Everything else, including the 3D map container, is created
  once here and never replaced.
-->
<div id="app" class="app">
  <header>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#F26B2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 3 3 5"/></svg>
      <b>Firewatch</b>
      <span class="muted" style="font-size:14px">Cottonwood Creek Fire District</span>
    </div>
    <div class="modes" id="modes" role="group" aria-label="Dashboard view"></div>
    <!-- "What if" scenario picker. Options are filled from SCENARIO_MENU. -->
    <label class="scenario">Scenario <select id="scenarioSelect"></select></label>
    <!-- Day badge + weather for the current scenario and step (re-rendered). -->
    <div class="conditions" id="conditions"></div>
  </header>

  <section class="tiles" id="tiles" aria-label="Key numbers"></section>

  <div class="body" id="body">
    <aside id="aside" hidden></aside>
    <div class="mapwrap">
      <div class="toolbar" id="toolbar"></div>

      <main class="map">
        <!-- 3D map (Cesium). Filled by map3d.js; never touched by render(). -->
        <div id="cesiumContainer" role="img" aria-label="3D map of the Cottonwood Creek district with the fire, power line, homes, water and station"></div>
        <div id="cesiumCredits" class="credits"></div>
        <button type="button" class="resetview" data-act="resetView">Reset view</button>
        <!-- Wind compass (bottom right). map3d.js rotates the arrow with the camera
             and hides the card when the "Wind" chip is off. -->
        <div id="windCompass" class="windcard" hidden>
          <!-- Dial centered at (28, 28). "N" sits outside the ring so the arrow never hides it. -->
          <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true">
            <circle cx="28" cy="28" r="18" fill="none" stroke="#5A5047" stroke-width="1.5"/>
            <g data-wind="north">
              <line x1="28" y1="10" x2="28" y2="14" stroke="#A89C88" stroke-width="1.5"/>
              <text x="28" y="8" text-anchor="middle" fill="#A89C88" font-size="8" font-weight="600" font-family="Barlow, sans-serif">N</text>
            </g>
            <g data-wind="arrow">
              <line x1="28" y1="40" x2="28" y2="21" stroke="#EDE3CF" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M28 14 L33.5 22 H22.5 Z" fill="#EDE3CF"/>
            </g>
          </svg>
          <div class="windtext"><b>Wind from S,</b><br>35 mph, gusts 55</div>
        </div>
        <div id="mapMsg" class="mapmsg" hidden></div>
        <!-- Confidence card and 1:53 alert pop-up (re-rendered). -->
        <div id="mapOverlays"></div>
      </main>

      <div class="legend">
        <span><i style="width:14px;height:10px;border:2px solid #FF4A1C;background:#1A1512;border-radius:5px 7px 6px 4px;box-shadow:0 0 5px rgba(255,74,28,0.8)"></i>Fire, burned inside</span>
        <span><i style="width:14px;height:10px;border:1px dashed #F26B2E;background:rgba(242,107,46,0.18)"></i>Fire path, 30 and 60 min</span>
        <span><i style="width:9px;height:9px;background:#F2A65A;border:1.5px solid #F26B2E"></i>Home in the path</span>
        <span><i style="width:9px;height:9px;background:#EDE3CF"></i>Home, safe for now</span>
        <span><i style="width:14px;height:8px;background:#6EA8D6"></i>Water</span>
        <span><i style="width:14px;height:2px;background:#C9B98F"></i>Power line</span>
        <span><i style="width:14px;height:3px;background:#E8B04A"></i>Firebreak</span>
        <span><i style="width:14px;height:10px;border:1px dashed #EDE3CF"></i>District boundary</span>

    ],

    },

    map: (k, v) => ({
      view: 'burn',
      fires: {
        A: v.now.escapeAcres ? { place: 'escape', acres: v.now.escapeAcres, cones: true,

        B: v.now.burnAcres ? { place: 'burn', acres: v.now.burnAcres,
          card: { tone: 'cream', title: 'Planned burn', sub: 'Section 22, until 2:00 pm' } } : null
      },
      firebreak: false, reporter: false, route: false, lineFault: false, burnArea: true,

for (const key in SCENARIOS) SCENARIOS[key].key = key;

// Short fire-mask words for the "Satellite sees heat (GOES, ...)" reason.
const MASK_SHORT = { 10: 'processed fire', 11: 'saturated fire', 12: 'cloud-contaminated fire', 13: 'high probability', 14: 'medium probability', 15: 'low probability' };

// Tabs, chips.
const CHIPS = [
  { key: 'spread', label: 'Fire path' }, { key: 'houses', label: 'Homes' }, { key: 'water', label: 'Water' },
  { key: 'stations', label: 'Fire stations' }, { key: 'power', label: 'Power lines' },
  { key: 'burns', label: 'Permitted burns' }, { key: 'risk', label: 'Fire risk today' },
  { key: 'wind', label: 'Wind' }, { key: 'sat', label: 'Satellite' }
];

const TABS = [
  { key: 'alerts', label: 'Alerts' }, { key: 'people', label: 'People' },
  { key: 'burns', label: 'Permitted burns' }, { key: 'data', label: 'Data' }
];

/* ---------- State ---------- */
const state = {
  scenario: 'real',
  powerData: true,     // "Co-op power data" switch (Real fire only)
  view: 'dashboard',   // 'dashboard' (map) or 'calculator' (Calculator tab)
  mode: 'simple',
  step: 0,
  playing: false,
  tab: 'alerts',
  alertClosed: false,
  actionMsg: '',
  layers: { spread: true, houses: true, water: true, stations: true, power: true, burns: false, risk: false, wind: true, sat: true, conf: false }
};
let timer = null;

// The scenario data in use (Real fire switches variant with the power-data switch).
function scenario() {
  return state.scenario === 'real' && !state.powerData ? SCENARIOS.realNoPower : SCENARIOS[state.scenario];
}

/* ---------- Helpers ---------- */
function pickStatus(list, k) {
  let out = null;
  for (const [from, text] of list) if (k >= from) out = text;
  return out;
}
// Last entry of a [{ from, ... }] list that applies at step k.
function pickFrom(list, k) {
  let out = list[0];
  for (const e of list) if (k >= e.from) out = e;
  return out;
}
// "12:48" + "pm" -> minutes after midnight.
function toMinutes(time, ampm) {
  const [h, m] = time.split(':').map(Number);
  return ((h % 12) + (ampm === 'pm' ? 12 : 0)) * 60 + m;
}
const stepAmPm = (sc, s) => s.ampm || sc.ampm;

/* ---------- Planned-burn rules ----------
   A registered burn counts as planned (and is NOT paged) only while BOTH hold:
     1. all heat is inside the registered area, and
     2. it is before the registered end time.
   If heat shows up outside the area, or the burn is still burning after the
   end time, it stops counting as planned and is treated as a possible wildfire. */
function burnRules(k) {
  const sc = SCENARIOS.burn, s = sc.steps[k];
  const inside = !s.heatOutside;
  const beforeEnd = toMinutes(s.time, stepAmPm(sc, s)) <= REGISTERED_BURN.endMin;
  return [
    { label: 'Inside registered area', ok: inside },
    { label: `Before ${REGISTERED_BURN.endText} end time`, ok: beforeEnd }
  ];
}
function burnMatchReason(k) {
  const [inside, beforeEnd] = burnRules(k).map(r => r.ok);
  if (inside && beforeEnd) return { label: 'Matches a registered burn', pts: -30 };
  if (!inside) return { label: 'No longer matches the burn', pts: 0 };
  return { label: 'Still burning after the end time', pts: 0 };
}
// Minutes from the (assumed) escape to the first heat seen outside the area.
function escapeCaughtMinutes() {
  const sc = SCENARIOS.burn;
  const first = sc.steps.find(s => s.heatOutside);
  return toMinutes(first.time, stepAmPm(sc, first)) - REGISTERED_BURN.escapeMin;
}

// Shared tiles.
const timeTile = v => ({ label: 'Time', value: v.now.time, unit: v.ampm, color: 'var(--text)', note: 'Simulated clock' });
const confTile = v => ({ label: v.sc.confLabel || 'Confidence', value: v.conf, unit: '%', color: v.conf >= 70 ? 'var(--fire)' : 'var(--text)', note: 'Alerts go out at 70%' });

const TONE = { fire: 'var(--fire)', calm: 'var(--calm)', text: 'var(--text)' };

function compute() {
  const sc = scenario();
  const k = Math.min(state.step, sc.steps.length - 1);
  const now = sc.steps[k];
  const full = state.mode === 'full';
  const ampm = stepAmPm(sc, now);

  // Satellite detections for this moment (simulated now; same format as the real feeds).
  const iso = Satellite.toIso(sc.key, now.time, ampm);
  const goes = Satellite.getGoesDetections(sc.key, iso);
  const firms = Satellite.getFirmsHotspots(sc.key, iso);
  const goesScan = Satellite.getGoesScanTime(sc.key, iso);
  const firmsPass = Satellite.getFirmsPassInfo(sc.key, iso);
  const strongest = Satellite.strongest(goes);

  // Confidence: sum of the reasons that apply now (negative points allowed), kept in 0..100.
  let sum = 0;
  const reasons = sc.reasons.map(r => {
    if (r.off) return { label: r.label, pts: 'off', color: 'var(--dim)' };
    if (k < r.from) return { label: r.label, pts: '—', color: 'var(--dim)' };
    let label = r.label, pts = r.pts;
    for (const [ck, ch] of r.changes || []) if (k >= ck) { if (ch.label) label = ch.label; if ('pts' in ch) pts = ch.pts; }
    if (r.rule) ({ label, pts } = r.rule(k));
    if (r.sat && strongest) label = `Satellite sees heat (${firms.length ? 'GOES + VIIRS' : 'GOES'}, ${MASK_SHORT[strongest.fire_mask]})`;
    sum += pts;
    return {
      label,
      pts: pts > 0 ? '+' + pts : pts < 0 ? '-' + Math.abs(pts) : '+0',
      color: pts > 0 ? 'var(--text)' : pts < 0 ? 'var(--calm)' : 'var(--dim)'
    };
  });
  const conf = Math.max(0, Math.min(100, sum));

  let statusLabel, statusColor;
  if (sc.status && sc.status[k]) {
    statusLabel = sc.status[k][0];
    statusColor = TONE[sc.status[k][1]];
  } else {
    statusLabel = conf < 50 ? 'Watching the line' : conf < 70 ? 'Possible fire' : conf < 90 ? 'Likely wildfire' : 'Confirmed wildfire';
    statusColor = conf < 70 ? 'var(--text)' : 'var(--fire)';
  }

  let responding = 0;
  const peopleRows = sc.people.rows.map(p => {
    let s = null, yes = false;
    for (const [from, text, ok] of p.s) if (k >= from) { s = text; yes = !!ok; }
    if (yes) responding++;
    return {
      who: p.who, note: p.note,
      status: s || (k >= sc.people.pagedFrom ? 'No reply' : sc.people.notPaged),
      color: yes ? 'var(--fire-soft)' : 'var(--dim)',
      dot: yes ? 'var(--fire)' : s ? 'var(--dim)' : '#4A4238'
    };
  });

  const alertRows = sc.alerts.map(a => {
    const s = pickStatus(a.s, k);
    const quiet = !s || /^Not /.test(s);
    return { who: a.who, status: s || a.none || 'Not sent yet', color: quiet ? 'var(--dim)' : 'var(--fire-soft)', dot: quiet ? '#4A4238' : 'var(--fire)' };
  });

  const v = { sc, k, now, ampm, full, conf, reasons, statusLabel, statusColor, peopleRows, alertRows, responding };
  v.tiles = sc.tiles(k, v);
  v.facts = sc.facts(k);
  // Data tab: the satellite rows come live from satellite.js.
  const goesText = goesScan
    ? `last scan ${Satellite.formatTime(goesScan)}, ` + (strongest
      ? `${strongest.fire_mask_label}, ` + (goes.length === 1 ? `${Math.round(goes[0].frp_mw)} MW`
        : `${goes.length} pixels, ${Math.round(goes.reduce((t, d) => t + d.frp_mw, 0))} MW total`)
      : 'no fire seen')
    : 'no scan yet';
  const firmsText = firms.length
    ? `hotspot ${Satellite.firmsTime(firms[0])}, ${firms[0].confidence}, ${firms[0].frp.toFixed(1)} MW`
    : firmsPass.lastPass ? `no pass since ${Satellite.formatTime(firmsPass.lastPass)}` : 'no pass yet';
  const otherRows = sc.data(k).filter(([name]) => !/^Satellite/.test(name));
  v.dataRows = [otherRows[0], ['GOES-East', goesText], ['FIRMS VIIRS', firmsText]].concat(otherRows.slice(1));
  v.firmsNote = firmsPass.note;
  v.goes = goes;
  v.firms = firms;
  v.compare = sc.compare.map(c => ({ label: c.label, ours: k >= c.from ? c.ours : '…', other: c.other, color: k >= c.from ? 'var(--fire)' : 'var(--dim)' }));
  v.rules = sc.rules ? sc.rules(k) : null;
  v.conditions = pickFrom(sc.conditions, k);
  v.wind = pickFrom(sc.wind, k);
  return v;
}

/* ---------- Pieces ---------- */
function ring(conf, size, fontSize) {
  const dash = (conf / 100 * 314.16).toFixed(1);
  return `
    <div class="ring" style="width:${size}px;height:${size}px">
      <svg width="${size}" height="${size}" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="50" fill="none" stroke="#3A332B" stroke-width="14"/>
        <circle cx="60" cy="60" r="50" fill="none" stroke="#F26B2E" stroke-width="14" stroke-dasharray="${dash} 400" transform="rotate(-90 60 60)"/>
      </svg>
      <div class="center"><span class="num" style="font-size:${fontSize}px;line-height:1">${conf}%</span><small>confidence</small></div>
    </div>`;
}

function reasonList(v) {
  return `<ul class="reasons">${v.reasons.map(r =>
    `<li style="color:${r.color}"><span>${r.label}</span><b>${r.pts}</b></li>`).join('')}</ul>`;
}

// Planned-burn rule check ("Inside registered area ✓  Before 2:00 pm end time ✓").
function ruleCheck(v) {
  if (!v.rules) return '';
  return `<div class="rulecheck">${v.rules.map(r =>
    `<span class="${r.ok ? 'ok' : 'bad'}">${r.label} ${r.ok ? '✓' : '✗'}</span>`).join('')}</div>`;
}

function asideInner(v) {
  let body = '';
  if (state.tab === 'alerts') {
    const note = v.sc.alertNote && v.k >= v.sc.alertNote.from
      ? `<div class="smsnote"><div class="muted">${v.sc.alertNote.title}</div><div class="smsbox">${v.sc.alertNote.text}</div></div>` : '';
    body = `<ul>${v.alertRows.map(a => `
      <li class="row"><span class="dot" style="background:${a.dot}"></span><span class="who">${a.who}</span><span style="color:${a.color}">${a.status}</span></li>`).join('')}</ul>${note}`;
  } else if (state.tab === 'people') {
    body = `<div class="tabintro">${v.sc.people.intro}</div><ul>${v.peopleRows.map(p => `
      <li class="row"><span class="dot" style="background:${p.dot}"></span><span style="flex:1 1 auto"><b>${p.who}</b> <span class="muted">${p.note}</span></span><span style="color:${p.color}">${p.status}</span></li>`).join('')}</ul>`;
  } else if (state.tab === 'burns') {
    const bt = v.sc.burnsTab(v.k);
    body = `<div class="tabintro">Burns farmers called in on purpose, so smoke there is not a false alarm</div>
      <ul>${bt.items.map(b => `
        <li class="burn"><div>${b.title}${b.badge ? ` <span class="burnbadge ${b.badgeTone}">${b.badge}</span>` : ''}</div><div>${b.sub}</div></li>`).join('')}
      </ul>
      <div class="burnrules">A registered burn stops counting as planned, and is treated as a possible wildfire, if it is
        <b>outside the registered area</b> or <b>still burning after the end time</b>.</div>`;
  } else {
    body = `<ul>${v.dataRows.map(([name, age]) => `
      <li class="row" style="justify-content:space-between"><b>${name}</b><span class="muted" style="text-align:right">${age}</span></li>`).join('')}</ul>
      ${v.firmsNote ? `<div class="datanote">${v.firmsNote}</div>` : ''}
      <div class="datanote">${Satellite.DATA_SOURCE === 'api' ? 'Live data from NOAA GOES Fire Detection and NASA FIRMS.'
        : 'Simulated in the same format as NOAA GOES Fire Detection and NASA FIRMS. Ready for live data.'}</div>`;
  }

  return `
    <section class="status" aria-label="Fire status">
      <h2 style="color:${v.statusColor}">${v.statusLabel}</h2>
      <div class="ringrow">${ring(v.conf, 112, 32)}${reasonList(v)}</div>
      ${ruleCheck(v)}
      <div class="note">Alerts go out automatically at 70%</div>
      <div class="facts">
        ${v.facts.map(([label, value]) => `<div><div>${label}</div><div>${value}</div></div>`).join('')}
      </div>
      <div class="actions">
        <button type="button" class="btn-light" data-act="ask">Ask nearby people</button>
        <button type="button" class="btn-ghost" data-act="false">Mark false alarm</button>
      </div>
      ${state.actionMsg ? `<div class="action-msg">${state.actionMsg}</div>` : ''}
    </section>
    <nav class="tabs" aria-label="Details">
      ${TABS.map(t => `<button type="button" class="${state.tab === t.key ? 'on' : ''}" aria-pressed="${state.tab === t.key}" data-act="tab:${t.key}">${t.label}</button>`).join('')}
    </nav>
    <div class="tabbody">${body}</div>`;
}

function confCard(v) {
  return `
  <section class="confcard" aria-label="Fire status">
    <h2 style="color:${v.statusColor}">${v.statusLabel}</h2>
    <div class="ringrow" style="gap:12px;margin-top:8px">${ring(v.conf, 92, 26)}${reasonList(v)}</div>
    ${ruleCheck(v)}
    <div class="facts" style="margin-top:10px;padding-top:8px">
      ${v.facts.slice(0, 2).map(([label, value]) => `<div><div>${label}</div><div style="font-size:13px">${value}</div></div>`).join('')}
    </div>
  </section>`;
}

function alertHtml(p) {
  return `
  <div class="overlay">
    <div class="alert" role="alertdialog" aria-label="Firewatch alert sent">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
        <div style="font-weight:600;font-size:18px">Firewatch alert sent</div>
        <div class="muted" style="font-size:13px">${p.time}</div>
      </div>
      <div class="muted" style="font-size:13px;margin-top:4px">This is the text people get on their phones:</div>
      <div class="sms">
        ${p.sms.map(line => line.startsWith('<b>') ? `<div style="font-weight:600">${line.slice(3, -4)}</div>` : `<div>${line}</div>`).join('')}
        <div style="text-decoration:underline">Open map</div>
      </div>
      <div class="muted" style="margin-top:10px;font-size:13px">${p.sentTo}</div>

}

function outcomeHtml(o) {
  return `<section class="outcome" aria-label="Outcome"><div class="outcome-title">${o.title}</div><div class="outcome-sub">${o.sub}</div></section>`;
}

/* ---------- Render ---------- */
// render() re-fills only the regions that change. The 3D map is never
// re-created: it is updated through Map3D.update() at the end.
const app = document.getElementById('app');
const regions = {
  modes: document.getElementById('modes'),
  conditions: document.getElementById('conditions'),
  scenarioSelect: document.getElementById('scenarioSelect'),
  tiles: document.getElementById('tiles'),
  body: document.getElementById('body'),
  aside: document.getElementById('aside'),
  toolbar: document.getElementById('toolbar'),
  overlays: document.getElementById('mapOverlays'),
  windText: document.querySelector('#windCompass .windtext'),
  footer: document.getElementById('footer')
};
// Calculator tab: the budget calculator's page, shown in #calcFrame.
const CALCULATOR_URL = 'Project_Avatar_Incremental_Budget_Site/index.html';
const calcFrame = document.getElementById('calcFrame');
regions.scenarioSelect.innerHTML = SCENARIO_MENU.map(([key, label]) => `<option value="${key}">${label}</option>`).join('');

function render(focusAct) {
  const v = compute();

  const chips = v.full ? CHIPS : CHIPS.concat([{ key: 'conf', label: 'Confidence' }]);

    <button type="button" class="${!dash ? 'on' : ''}" aria-pressed="${!dash}" data-act="view:calculator">Calculator</button>`;
  // Calculator tab: hides the tiles and map area (the map keeps its state) and shows the calculator.
  app.classList.toggle('calc', !dash);
  regions.scenarioSelect.value = state.scenario;

  // Header: day type badge and weather for this scenario and step.
  const c = v.conditions;
  regions.conditions.innerHTML = `

      ${c.weather.map(([label, value]) => `<div><span class="muted">${label} </span><b>${value}</b></div>`).join('')}
    </div>`;
  regions.windText.innerHTML = `<b>Wind from ${v.wind.dir},</b><br>${v.wind.text}`;

  regions.tiles.innerHTML = v.tiles.map(t => `
    <div class="tile">
      <div class="tl">${t.label}</div>
      <div class="tv num" style="color:${t.color}">${t.value}<span> ${t.unit}</span></div>
      <div class="tn">${t.note}</div>
    </div>`).join('');

  regions.body.classList.toggle('full', v.full);
  regions.aside.hidden = !v.full;
  regions.aside.innerHTML = v.full ? asideInner(v) : '';

  regions.toolbar.innerHTML = `
    <span class="muted" style="font-size:13px;margin-right:4px">Show on map</span>
    ${chips.map(c => {
      const on = !!state.layers[c.key];
      return `<button type="button" class="chip ${on ? 'on' : ''}" aria-pressed="${on}" data-act="layer:${c.key}">${c.label}</button>`;
    }).join('')}

  regions.overlays.innerHTML =
    (!v.full && state.layers.conf ? confCard(v) : '') +
    (sc.outcome && v.k >= sc.outcome.at ? outcomeHtml(sc.outcome) : '') +

  const powerSwitch = state.scenario === 'real' ? `
      <button type="button" class="pswitch ${state.powerData ? 'on' : ''}" aria-pressed="${state.powerData}" data-act="power">
        <span class="pswitch-track"><span class="pswitch-knob"></span></span>Co-op power data: <b>${state.powerData ? 'On' : 'Off'}</b>
      </button>` : '';

  regions.footer.innerHTML = `
    <div class="ctlcol">
      <div class="controls">
        <button type="button" data-act="back">Back</button>
        <button type="button" class="play" data-act="play">${state.playing ? 'Pause' : 'Play'}</button>
        <button type="button" data-act="next">Next</button>

      ${powerSwitch}

    <div style="min-width:0">
      <div class="steps">
        ${sc.steps.map((s, i) => `<button type="button" class="${i === v.k ? 'on' : i < v.k ? 'done' : ''}" aria-label="Go to ${s.time} ${stepAmPm(sc, s)}" data-act="step:${i}">${s.time}</button>`).join('')}
      </div>
      <div class="caption">${v.now.caption}</div>
      ${v.now.real ? `<div class="real">What really happened at ${v.now.time}: ${v.now.real}</div>` : ''}
      ${sc.extraLine ? `<div class="offnote">${sc.extraLine}</div>` : ''}
    </div>
    <div class="compare">
      <span></span>
      <span style="font-size:12px;font-weight:600;color:var(--fire)">${sc.compareCols[0]}</span>
      <span class="muted" style="font-size:12px">${sc.compareCols[1]}</span>
      ${v.compare.map(c => `
        <span class="muted">${c.label}</span>
        <span style="font-weight:600;color:${c.color}">${c.ours}</span>
        <span class="muted">${c.other}</span>`).join('')}
    </div>`;

  // 3D map: only moves/resizes/hides existing objects.
  Map3D.update(Object.assign({ layers: state.layers, wind: { towardDeg: v.wind.towardDeg, mph: v.wind.mph }, goes: v.goes, firms: v.firms }, sc.map(v.k, v)));

  if (focusAct) {
    const el = app.querySelector(`[data-act="${focusAct}"]`);
    if (el) el.focus();
  }
}

/* ---------- Actions ---------- */
function stopTimer() {
  if (timer) { clearInterval(timer); timer = null; }
  state.playing = false;
}

function goTo(i) {
  state.step = Math.max(0, Math.min(scenario().steps.length - 1, i));
  state.alertClosed = false;
  state.actionMsg = '';
}

// Switching scenario (or the power-data switch) restarts playback at step 1.
function setScenario(key) {
  stopTimer();
  state.scenario = key;
  // Layers a scenario turns on by itself (Planned burn shows Permitted burns).
  state.layers.burns = !!(SCENARIOS[key].layersOnEnter && SCENARIOS[key].layersOnEnter.burns);
  goTo(0);
}

function togglePlay() {
  if (state.playing) { stopTimer(); return; }
  if (state.step >= scenario().steps.length - 1) goTo(0);
  state.playing = true;
  timer = setInterval(() => {
    if (state.step >= scenario().steps.length - 1) { stopTimer(); render(); return; }
    goTo(state.step + 1);
    render();
  }, 2800);
}

app.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const [name, arg] = act.split(':');

  if (name === 'resetView') { Map3D.resetView(); return; }   // camera only, no re-render

  if (name === 'mode') { state.mode = arg; state.view = 'dashboard'; }
  else if (name === 'view') {
    if (arg === 'calculator') {
      stopTimer();   // don't keep playing the replay out of sight
      if (!calcFrame.getAttribute('src')) calcFrame.src = CALCULATOR_URL;   // load once, keep its state
    }
    state.view = arg;
    render(arg === 'dashboard' ? `mode:${state.mode}` : act);
    return;
  }
  else if (name === 'layer') state.layers[arg] = !state.layers[arg];
  else if (name === 'tab') state.tab = arg;
  else if (name === 'step') { stopTimer(); goTo(Number(arg)); }
  else if (name === 'back') { stopTimer(); goTo(state.step - 1); }
  else if (name === 'next') { stopTimer(); goTo(state.step + 1); }
  else if (name === 'play') togglePlay();
  else if (name === 'power') { stopTimer(); state.powerData = !state.powerData; goTo(0); }
  else if (name === 'closeAlert') state.alertClosed = true;
  else if (name === 'ask') state.actionMsg = 'Texted 4 people within 5 miles: “Can you see smoke? Reply YES or NO.”';
  else if (name === 'false') state.actionMsg = 'Marked as a false alarm. Alerts stop.';

  render(act);
});

regions.scenarioSelect.addEventListener('change', e => {
  setScenario(e.target.value);
  render();
});

render();

// Create the 3D map once. Shows a message in the map area if the token is missing or wrong.
Map3D.init({
  container: document.getElementById('cesiumContainer'),
  credits: document.getElementById('cesiumCredits'),
  message: document.getElementById('mapMsg'),
  compass: document.getElementById('windCompass')
});
</script>
</body>
</html>
