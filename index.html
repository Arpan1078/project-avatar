<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firewatch dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
  :root {
    --bg: #15120F;
    --map: #1B1814;
    --panel: #221E19;
    --panel-2: #26211C;
    --line: #3A332B;
    --line-soft: #332D26;
    --text: #EDE3CF;
    --text-2: #D9CFBC;
    --muted: #A89C88;
    --dim: #8A7F70;
    --fire: #F26B2E;
    --fire-soft: #F2A65A;
    --warn: #C2410C;
    --water: #6EA8D6;
    --water-text: #9CC4E4;
    --break: #E8B04A;
    --power: #C9B98F;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { color: var(--text); font-family: 'Barlow', system-ui, sans-serif; font-size: 15px; line-height: 1.35; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--fire-soft); outline-offset: 2px; }
  ul { list-style: none; margin: 0; padding: 0; }
  .num { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; }
  .muted { color: var(--muted); }

  .app { height: 100vh; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 8px; padding: 0 10px 10px; }

  header { display: flex; align-items: center; gap: 22px; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand b { font-weight: 600; font-size: 18px; }
  .modes { display: flex; border: 1px solid #5A5047; }
  .modes button { min-height: 32px; padding: 4px 16px; border: none; background: transparent; color: var(--text); font-size: 14px; font-weight: 600; }
  .modes button.on { background: var(--text); color: #1B1814; }
  .flag { font-size: 13px; font-weight: 600; background: var(--warn); color: #fff; padding: 3px 10px; }
  .weather { display: flex; gap: 20px; margin-left: auto; font-size: 14px; }
  .weather b { font-weight: 600; }

  .tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--line); padding: 6px 12px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .tile .tl { font-size: 14px; color: var(--text-2); }
  .tile .tv { font-size: 38px; line-height: 1.05; }
  .tile .tv span { font-size: 18px; }
  .tile .tn { font-size: 12px; color: var(--muted); }

  .body { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .body.full { grid-template-columns: 340px minmax(0, 1fr); }

  aside { min-height: 0; overflow: hidden; background: var(--panel); border: 1px solid var(--line); display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
  .status { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .status h2 { margin: 0; font-size: 18px; font-weight: 600; text-align: center; }
  .ringrow { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
  .ring { position: relative; flex: 0 0 auto; }
  .ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .center small { font-size: 11px; color: var(--muted); }
  .reasons { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .reasons li { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
  .reasons li b { font-weight: 600; }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center; }
  .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .facts div div:first-child { font-size: 12px; color: var(--muted); }
  .facts div div:last-child { font-weight: 600; font-size: 14px; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .actions button { flex: 1 1 0; min-height: 36px; font-size: 13px; font-weight: 600; }
  .btn-light { background: var(--text); color: #1B1814; border: none; }
  .btn-ghost { background: none; color: var(--text); border: 1px solid #5A5047; }
  .action-msg { margin-top: 6px; font-size: 12px; color: var(--fire-soft); }

  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1 1 auto; min-height: 38px; padding: 0 6px; background: none; border: none; border-bottom: 3px solid transparent; color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .tabs button.on { border-bottom-color: var(--fire); color: var(--text); }
  .tabbody { min-height: 0; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 10px; padding: 7px 16px; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
  .row .dot { width: 10px; height: 10px; border-radius: 5px; flex: 0 0 auto; }
  .row .who { flex: 1 1 auto; font-weight: 600; }
  .tabintro { font-size: 12px; color: var(--muted); padding: 7px 16px; }
  .burn { padding: 8px 16px; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
  .burn div:first-child { font-weight: 600; }
  .burn div:last-child { font-size: 12px; color: var(--muted); }

  .mapwrap { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; border: 1px solid var(--line); overflow: hidden; background: var(--map); }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .chip { min-height: 30px; padding: 3px 12px; border-radius: 15px; border: 1px solid #5A5047; background: var(--map); color: var(--text); font-size: 13px; font-weight: 500; white-space: nowrap; }
  .chip.on { background: var(--text); color: #1B1814; border-color: var(--text); }
  .sim { margin-left: auto; font-size: 12px; color: var(--muted); }

  .map { position: relative; min-height: 0; overflow: hidden; }
  .map > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map text { font-family: 'Barlow', sans-serif; font-size: 12px; }

  .confcard { position: absolute; top: 12px; left: 12px; width: 270px; background: rgba(34, 30, 25, 0.95); border: 1px solid var(--line); padding: 12px 14px; }
  .confcard h2 { margin: 0; font-size: 17px; font-weight: 600; }

  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 20px; padding: 6px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-2); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { display: inline-block; }

  footer { background: var(--panel); border-top: 1px solid var(--line); padding: 10px 16px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 22px; align-items: center; }
  .controls { display: flex; gap: 6px; }
  .controls button { min-height: 38px; min-width: 60px; background: var(--panel-2); color: var(--text); border: 1px solid #4A4238; font-size: 14px; font-weight: 600; }
  .controls button.play { min-width: 74px; background: var(--fire); color: #1B1814; border: none; }
  .steps { display: flex; gap: 4px; margin-bottom: 4px; }
  .steps button { flex: 1 1 0; min-width: 0; min-height: 24px; padding: 0; border: none; border-top: 3px solid var(--line); background: none; color: var(--muted); font-size: 12px; font-weight: 600; }
  .steps button.done { border-top-color: #7A4A2E; }
  .steps button.on { border-top-color: var(--fire); color: var(--text); }
  .caption { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .real { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .compare { display: grid; grid-template-columns: auto auto auto; gap: 1px 14px; align-items: baseline; font-size: 13px; padding-left: 18px; border-left: 1px solid var(--line); }

  .overlay { position: absolute; inset: 0; background: rgba(14, 12, 10, 0.6); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .alert { width: 100%; max-width: 420px; background: var(--panel-2); border: 1px solid #4A4238; border-top: 6px solid var(--fire); padding: 16px 22px; }
  .alert .sms { margin-top: 10px; background: var(--text); color: #1B1814; padding: 12px 16px; font-size: 15px; line-height: 1.5; }
  .alert button { margin-top: 12px; min-height: 44px; width: 100%; background: var(--fire); color: #1B1814; border: none; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- Scenario data (simulated Cottonwood Creek fire) ---------- */
const STEPS = [
  { time: '1:50', acres: '0',   rx: 3,  ry: 4,   caption: 'A gust drops the power line into dry grass. The co-op’s meters show the line lost power.', real: 'nobody knew.' },
  { time: '1:51', acres: '5',   rx: 5,  ry: 7,   caption: 'Red flag day and no burn permit nearby, so Firewatch flags a possible fire.', real: 'nobody knew.' },
  { time: '1:52', acres: '15',  rx: 8,  ry: 12,  caption: 'A weather satellite sees heat over the line. Confidence passes 70%.', real: 'nobody knew. Nobody was within four miles.' },
  { time: '1:53', acres: '22',  rx: 10, ry: 15,  caption: 'Alerts go out by text to the chief, dispatch, the rancher downwind, the water truck and 3 homes.', real: 'nobody knew. The first 911 call was 28 minutes away.' },
  { time: '1:56', acres: '45',  rx: 15, ry: 24,  caption: 'Dispatch pages the volunteers. Three of the five who are free reply.', real: 'nobody knew.' },
  { time: '1:59', acres: '80',  rx: 20, ry: 34,  caption: 'A neighbor sends a photo. The rancher starts cutting a firebreak ahead of the fire.', real: 'nobody knew.' },
  { time: '2:04', acres: '160', rx: 28, ry: 52,  caption: 'Brush 1 leaves the station. Nearby departments and the state get a heads-up.', real: 'nobody knew. A driver saw smoke at 2:17, with no signal.' },
  { time: '2:22', acres: '600', rx: 52, ry: 110, caption: 'Brush 1 arrives. The firebreak is already ahead of the fire.', real: 'the 911 call had just come in. The truck left at 2:34.' }
];

const REASONS = [
  { label: 'Power lost on the line', pts: 30, from: 0 },
  { label: 'Red flag day',           pts: 15, from: 1 },
  { label: 'No burn permit nearby',  pts: 10, from: 1 },
  { label: 'Satellite sees heat',    pts: 25, from: 2 },
  { label: 'Neighbor photo',         pts: 15, from: 5 }
];

const ALERTS = [
  { who: 'Fire chief',          s: [[3, 'Text sent 1:53'], [4, 'Heading in']] },
  { who: 'County 911 dispatch', s: [[3, 'Alert sent 1:53'], [4, 'Paged 1:56']] },
  { who: 'Rancher downwind',    s: [[3, 'Text sent 1:53'], [5, 'Cutting firebreak']] },
  { who: 'Lease water truck',   s: [[3, 'Text sent 1:53'], [5, 'Moving']] },
  { who: '3 homes in the path', s: [[3, 'Warned 1:53']] },
  { who: 'Nearby departments',  s: [[6, 'Heads-up 2:04']] },
  { who: 'State fire desk',     s: [[6, 'Heads-up 2:04']] }
];

const PEOPLE = [
  { who: 'Volunteer 1', note: 'farm',        s: [[4, 'Responding'], [6, 'On Brush 1']] },
  { who: 'Volunteer 2', note: 'in town',     s: [[4, 'Responding'], [6, 'On Brush 1']] },
  { who: 'Volunteer 3', note: 'co-op yard',  s: [[4, 'Responding'], [6, 'Bringing tanker']] },
  { who: 'Volunteer 4', note: 'out of town', s: [[4, 'Can’t make it']], no: true },
  { who: 'Volunteer 5', note: 'at work',     s: [] }
];

const HOUSES = [
  { x: 488, y: 150, path: true }, { x: 508, y: 160, path: true }, { x: 470, y: 128, path: true },
  { x: 700, y: 440, path: false }, { x: 240, y: 380, path: false }, { x: 880, y: 230, path: false }, { x: 160, y: 200, path: false }
];

const CHIPS = [
  { key: 'spread', label: 'Fire path' }, { key: 'houses', label: 'Homes' }, { key: 'water', label: 'Water' },
  { key: 'stations', label: 'Fire stations' }, { key: 'power', label: 'Power lines' },
  { key: 'burns', label: 'Permitted burns' }, { key: 'risk', label: 'Fire risk today' }
];

const TABS = [
  { key: 'alerts', label: 'Alerts' }, { key: 'people', label: 'People' },
  { key: 'burns', label: 'Permitted burns' }, { key: 'data', label: 'Data' }
];

/* ---------- State ---------- */
const state = {
  mode: 'simple',
  step: 0,
  playing: false,
  tab: 'alerts',
  alertClosed: false,
  actionMsg: '',
  layers: { spread: true, houses: true, water: true, stations: true, power: true, burns: false, risk: false, conf: false }
};
let timer = null;

/* ---------- Helpers ---------- */
function pickStatus(list, k) {
  let out = null;
  for (const [from, text] of list) if (k >= from) out = text;
  return out;
}

function compute() {
  const k = state.step;
  const now = STEPS[k];
  const full = state.mode === 'full';

  let conf = 0;
  const reasons = REASONS.map(r => {
    const on = k >= r.from;
    if (on) conf += r.pts;
    return { label: r.label, pts: on ? '+' + r.pts : '—', color: on ? 'var(--text)' : 'var(--dim)' };
  });
  const statusLabel = conf < 50 ? 'Watching the line' : conf < 70 ? 'Possible fire' : conf < 90 ? 'Likely wildfire' : 'Confirmed wildfire';
  const statusColor = conf < 70 ? 'var(--text)' : 'var(--fire)';

  let responding = 0;
  const peopleRows = PEOPLE.map(p => {
    const s = pickStatus(p.s, k);
    const yes = s && !p.no;
    if (yes) responding++;
    return {
      who: p.who, note: p.note,
      status: s || (k >= 4 ? 'No reply' : 'Not paged yet'),
      color: yes ? 'var(--fire-soft)' : 'var(--dim)',
      dot: yes ? 'var(--fire)' : s ? 'var(--dim)' : '#4A4238'
    };
  });

  const alertRows = ALERTS.map(a => {
    const s = pickStatus(a.s, k);
    return { who: a.who, status: s || 'Not sent yet', color: s ? 'var(--fire-soft)' : 'var(--dim)', dot: s ? 'var(--fire)' : '#4A4238' };
  });

  const aheadVal = k >= 7 ? '30' : k >= 3 ? '28' : '0';
  const aheadNote = k >= 7 ? 'Truck arrived 30 min sooner' : k >= 3 ? 'Fire known before anyone called' : 'Counts once alerts go out';

  const tiles = [
    { label: 'Time', value: now.time, unit: 'pm', color: 'var(--text)', note: 'Simulated clock' },
    { label: 'Confidence', value: conf, unit: '%', color: conf >= 70 ? 'var(--fire)' : 'var(--text)', note: 'Alerts go out at 70%' },
    { label: 'Area burned', value: now.acres, unit: 'acres', color: 'var(--fire)', note: k >= 3 ? 'Simulated estimate' : 'From the scenario' },
    { label: 'Homes in path', value: k >= 1 ? 3 : 0, unit: '', color: k >= 1 ? 'var(--fire-soft)' : 'var(--text)', note: 'Next 60 min' },
    { label: 'Volunteers responding', value: responding, unit: 'of 5', color: 'var(--text)', note: '18 on the roster' },
    { label: 'Ahead of 911', value: aheadVal, unit: 'min', color: k >= 3 ? 'var(--fire)' : 'var(--text)', note: aheadNote }
  ];

  const dataRows = [
    { name: 'Power outages (co-op)', age: 'Live' },
    { name: 'Satellite heat (GOES)', age: k >= 2 ? '1 min ago' : 'No heat yet' },
    { name: 'Satellite (VIIRS)', age: 'Last pass 3 h ago' },
    { name: 'Weather (NWS)', age: '5 min ago' },
    { name: 'Community reports', age: k >= 5 ? '1 photo, 1:59' : 'None yet' },
    { name: 'Air quality (AirNow)', age: 'Sensor too far' },
    { name: 'Burn permits', age: 'Today’s list' }
  ];

  const compare = [
    { label: 'Fire known',    ours: k >= 3 ? '1:53' : '…', real: '2:21', color: k >= 3 ? 'var(--fire)' : 'var(--dim)' },
    { label: 'Truck leaves',  ours: k >= 6 ? '2:04' : '…', real: '2:34', color: k >= 6 ? 'var(--fire)' : 'var(--dim)' },
    { label: 'Truck arrives', ours: k >= 7 ? '2:22' : '…', real: '2:52', color: k >= 7 ? 'var(--fire)' : 'var(--dim)' }
  ];

  const brushStatus = k >= 7 ? 'On scene' : k >= 6 ? 'Driving' : k >= 4 ? 'Crew gathering' : 'At station';

  return { k, now, full, conf, reasons, statusLabel, statusColor, peopleRows, alertRows, tiles, dataRows, compare, brushStatus };
}

/* ---------- Map (SVG) ---------- */
function mapSvg(v) {
  const L = state.layers, k = v.k, now = v.now;
  const show = b => (b ? 1 : 0);

  const ox = 470, oy = 379;
  const cx = ox + now.ry * 0.15, cy = oy - now.ry * 0.7, headY = cy - now.ry, w = now.rx;
  const y30 = Math.max(24, headY - 110), y60 = Math.max(24, headY - 220);
  const cone30 = `${cx - w},${cy} ${cx - w * 1.8 - 30},${y30} ${cx + w * 1.8 + 30},${y30} ${cx + w},${cy}`;
  const cone60 = `${cx - w},${cy} ${cx - w * 2.6 - 60},${y60} ${cx + w * 2.6 + 60},${y60} ${cx + w},${cy}`;

  let grid = '';
  for (let x = -300; x <= 1300; x += 62) grid += `<line x1="${x}" y1="0" x2="${x}" y2="640"/>`;
  for (let y = 0; y <= 620; y += 62) grid += `<line x1="-320" y1="${y}" x2="1320" y2="${y}"/>`;

  let poles = '';
  for (let px = 100; px <= 940; px += 70) {
    const py = 420 - (px - 60) * 0.1;
    poles += `<line x1="${px}" y1="${py - 5}" x2="${px}" y2="${py + 5}"/>`;
  }

  const houses = HOUSES.map(h =>
    `<rect x="${h.x - 4.5}" y="${h.y - 4.5}" width="9" height="9" fill="${h.path ? '#F2A65A' : '#EDE3CF'}" stroke="${h.path ? '#F26B2E' : '#EDE3CF'}" stroke-width="1.5"/>`
  ).join('');

  return `
  <svg viewBox="-300 30 1600 570" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map of the Cottonwood Creek district with the fire, power line, homes, water and station">
    <g stroke="#3A332B" stroke-width="1" opacity="0.7">${grid}</g>
    <g fill="none" stroke="#8C8170" stroke-width="1.2" opacity="0.55">
      <path d="M-320,120 C-200,60 -80,150 0,90 C150,40 300,140 460,90 S760,30 1000,110 S1200,40 1320,90"/>
      <path d="M-320,230 C-220,190 -100,210 0,180 C120,150 260,230 400,200 S640,120 820,190 S960,260 1000,230 S1180,180 1320,240"/>
      <path d="M-320,540 C-200,580 -80,520 0,560 C140,520 260,600 420,560 S700,500 1000,580 S1200,520 1320,560"/>
      <path d="M-280,620 C-260,520 -180,500 -150,430 S-60,380 -120,300 S-220,240 -200,30"/>
      <path d="M-120,360 C-90,330 -40,340 -45,370 S-110,400 -120,360 Z"/>
      <path d="M1120,620 C1100,520 1180,470 1160,400 S1080,300 1150,220 S1250,120 1220,30"/>
      <path d="M1060,470 C1090,450 1140,460 1135,490 S1070,510 1060,470 Z"/>
      <path d="M80,620 C120,520 60,460 160,430 S300,470 340,400 S300,300 380,260"/>
      <path d="M620,620 C640,540 760,560 780,480 S900,420 1000,450 S1200,470 1320,430"/>
      <path d="M560,0 C600,120 700,100 720,170 S680,260 760,300 S900,300 1000,330"/>
      <path d="M640,250 C680,230 730,250 720,280 S650,300 640,250 Z"/>
      <path d="M200,250 C230,230 280,240 275,265 S215,285 200,250 Z"/>
      <path d="M-320,300 C-200,340 -80,280 0,330 C90,300 160,360 230,340 S330,280 420,300"/>
    </g>
    <path d="M50,60 L940,50 L955,560 L60,575 Z" fill="none" stroke="#EDE3CF" stroke-width="1.4" stroke-dasharray="8 7" opacity="0.5"/>

    <g opacity="${show(L.risk)}">
      <polygon points="60,392 960,302 960,358 60,448" fill="#E8B04A" fill-opacity="0.13" stroke="#E8B04A" stroke-opacity="0.4" stroke-dasharray="2 5"/>
      <text x="620" y="374" fill="#E8B04A">High risk today: power line over dry grass</text>
    </g>

    <g opacity="${show(L.burns)}">
      <circle cx="720" cy="515" r="30" fill="#6E665C" fill-opacity="0.35" stroke="#A89C88" stroke-dasharray="3 4"/>
      <text x="720" y="562" text-anchor="middle" fill="#A89C88">Permitted burn, Sat (out)</text>
      <circle cx="300" cy="505" r="22" fill="#6E665C" fill-opacity="0.35" stroke="#A89C88" stroke-dasharray="3 4"/>
      <text x="300" y="545" text-anchor="middle" fill="#A89C88">Permitted burn, Sun (out)</text>
    </g>

    <g opacity="${show(L.spread && k >= 1)}">
      <polygon points="${cone60}" fill="#F26B2E" fill-opacity="0.07" stroke="#F26B2E" stroke-opacity="0.45" stroke-dasharray="5 6"/>
      <polygon points="${cone30}" fill="#F26B2E" fill-opacity="0.14" stroke="#F26B2E" stroke-opacity="0.7" stroke-dasharray="5 6"/>
      <text x="${cx}" y="${y30 + 16}" text-anchor="middle" fill="#F2A65A">in 30 min</text>
      <text x="${cx}" y="${y60 + 16}" text-anchor="middle" fill="#F2A65A">in 60 min</text>
    </g>

    <g opacity="${show(L.power)}" stroke="#C9B98F" stroke-width="1.6">
      <line x1="60" y1="420" x2="960" y2="330"/>
      ${poles}
      <text x="80" y="438" fill="#C9B98F" stroke="none">Oil-lease power line</text>
    </g>

    <path d="M800,112 L800,300 L470,300 L470,370" fill="none" stroke="#EDE3CF" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round" opacity="${show(L.stations && k >= 6)}"/>

    <g opacity="${show(L.houses)}">
      ${houses}
      <text x="520" y="124" fill="#F2A65A">3 homes in the fire path</text>
      <text x="520" y="164" fill="#EDE3CF">Rancher, has a disc</text>
    </g>

    <g opacity="${show(k >= 5)}">
      <line x1="410" y1="190" x2="560" y2="190" stroke="#E8B04A" stroke-width="3" stroke-dasharray="10 4"/>
      <text x="566" y="194" fill="#E8B04A">Firebreak</text>
    </g>

    <g opacity="${show(L.water)}">
      <ellipse cx="430" cy="250" rx="14" ry="9" fill="#6EA8D6" fill-opacity="0.55" stroke="#6EA8D6"/>
      <text x="450" y="254" fill="#9CC4E4">Stock pond</text>
      <rect x="548" y="392" width="16" height="9" fill="#6EA8D6" stroke="#9CC4E4"/>
      <text x="570" y="401" fill="#9CC4E4">Lease water truck</text>
      <circle cx="250" cy="300" r="7" fill="none" stroke="#6EA8D6" stroke-width="2"/>
      <text x="262" y="304" fill="#9CC4E4">Tank</text>
    </g>

    <g opacity="${show(L.stations)}">
      <rect x="790" y="100" width="20" height="20" fill="#EDE3CF"/>
      <text x="818" y="115" fill="#EDE3CF" font-weight="600" style="font-size:13px">Fire station</text>
      <text x="818" y="131" fill="#A89C88">11 mi of gravel to the fire</text>
      <rect x="80" y="470" width="14" height="14" fill="none" stroke="#EDE3CF" stroke-width="1.5"/>
      <text x="102" y="482" fill="#A89C88">Mutual aid, 30 to 40 min</text>
    </g>

    <g opacity="${show(k >= 5)}">
      <line x1="790" y1="395" x2="${cx}" y2="${cy}" stroke="#EDE3CF" stroke-width="1" stroke-dasharray="4 4"/>
      <circle cx="790" cy="395" r="6" fill="#EDE3CF"/>
      <text x="800" y="414" fill="#EDE3CF">Neighbor photo, 1:59</text>
    </g>

    <circle cx="${cx}" cy="${headY}" r="${14 + now.rx * 0.8}" fill="#F26B2E" fill-opacity="0.18"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${now.rx}" ry="${now.ry}" fill="#0E0C0A" stroke="#F26B2E" stroke-width="3"/>
    <circle cx="470" cy="379" r="4" fill="#F2A65A"/>
  </svg>`;
}

/* ---------- Pieces ---------- */
function ring(conf, size, fontSize) {
  const dash = (conf / 100 * 314.16).toFixed(1);
  return `
    <div class="ring" style="width:${size}px;height:${size}px">
      <svg width="${size}" height="${size}" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="50" fill="none" stroke="#3A332B" stroke-width="14"/>
        <circle cx="60" cy="60" r="50" fill="none" stroke="#F26B2E" stroke-width="14" stroke-dasharray="${dash} 400" transform="rotate(-90 60 60)"/>
      </svg>
      <div class="center"><span class="num" style="font-size:${fontSize}px;line-height:1">${conf}%</span><small>confidence</small></div>
    </div>`;
}

function reasonList(v) {
  return `<ul class="reasons">${v.reasons.map(r =>
    `<li style="color:${r.color}"><span>${r.label}</span><b>${r.pts}</b></li>`).join('')}</ul>`;
}

function asideHtml(v) {
  let body = '';
  if (state.tab === 'alerts') {
    body = `<ul>${v.alertRows.map(a => `
      <li class="row"><span class="dot" style="background:${a.dot}"></span><span class="who">${a.who}</span><span style="color:${a.color}">${a.status}</span></li>`).join('')}</ul>`;
  } else if (state.tab === 'people') {
    body = `<div class="tabintro">5 of 18 volunteers can leave work this afternoon</div><ul>${v.peopleRows.map(p => `
      <li class="row"><span class="dot" style="background:${p.dot}"></span><span style="flex:1 1 auto"><b>${p.who}</b> <span class="muted">${p.note}</span></span><span style="color:${p.color}">${p.status}</span></li>`).join('')}</ul>`;
  } else if (state.tab === 'burns') {
    body = `<div class="tabintro">Burns farmers called in on purpose, so smoke there is not a false alarm</div>
      <ul>
        <li class="burn"><div>Section 14 pasture</div><div>Saturday, called in to dispatch, out by 6 pm</div></li>
        <li class="burn"><div>Section 31 pasture</div><div>Sunday, called in to dispatch, out by 5 pm</div></li>
        <li class="burn" style="border-bottom:none"><div>Today</div><div>None. No burning on a red flag day.</div></li>
      </ul>`;
  } else {
    body = `<ul>${v.dataRows.map(d => `
      <li class="row" style="justify-content:space-between"><b>${d.name}</b><span class="muted">${d.age}</span></li>`).join('')}</ul>`;
  }

  return `
  <aside>
    <section class="status" aria-label="Fire status">
      <h2 style="color:${v.statusColor}">${v.statusLabel}</h2>
      <div class="ringrow">${ring(v.conf, 112, 32)}${reasonList(v)}</div>
      <div class="note">Alerts go out automatically at 70%</div>
      <div class="facts">
        <div><div>Likely cause</div><div>Power line down</div></div>
        <div><div>Heading</div><div>N-NE, 2–3 mph</div></div>
        <div><div>Nearest water</div><div>Stock pond</div></div>
        <div><div>Brush 1</div><div>${v.brushStatus}</div></div>
      </div>
      <div class="actions">
        <button type="button" class="btn-light" data-act="ask">Ask nearby people</button>
        <button type="button" class="btn-ghost" data-act="false">Mark false alarm</button>
      </div>
      ${state.actionMsg ? `<div class="action-msg">${state.actionMsg}</div>` : ''}
    </section>
    <nav class="tabs" aria-label="Details">
      ${TABS.map(t => `<button type="button" class="${state.tab === t.key ? 'on' : ''}" aria-pressed="${state.tab === t.key}" data-act="tab:${t.key}">${t.label}</button>`).join('')}
    </nav>
    <div class="tabbody">${body}</div>
  </aside>`;
}

function confCard(v) {
  return `
  <section class="confcard" aria-label="Fire status">
    <h2 style="color:${v.statusColor}">${v.statusLabel}</h2>
    <div class="ringrow" style="gap:12px;margin-top:8px">${ring(v.conf, 92, 26)}${reasonList(v)}</div>
    <div class="facts" style="margin-top:10px;padding-top:8px">
      <div><div>Likely cause</div><div style="font-size:13px">Power line down</div></div>
      <div><div>Heading</div><div style="font-size:13px">N-NE, 2–3 mph</div></div>
    </div>
  </section>`;
}

function alertHtml() {
  return `
  <div class="overlay">
    <div class="alert" role="alertdialog" aria-label="Firewatch alert sent">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
        <div style="font-weight:600;font-size:18px">Firewatch alert sent</div>
        <div class="muted" style="font-size:13px">1:53 pm</div>
      </div>
      <div class="muted" style="font-size:13px;margin-top:4px">This is the text people get on their phones:</div>
      <div class="sms">
        <div style="font-weight:600">Likely wildfire, 80% confidence</div>
        <div>11 mi NW of station, at the oil-lease line by Rd 14.</div>
        <div>Cause: power line down.</div>
        <div>Moving N-NE. Wind S 35, gusts 55.</div>
        <div>3 homes in the path. Nearest water: stock pond.</div>
        <div style="text-decoration:underline">Open map</div>
      </div>
      <div class="muted" style="margin-top:10px;font-size:13px">Sent to the chief, county dispatch, the rancher downwind, the lease operator and 3 homes. Plain text, so it works on one bar of signal.</div>
      <button type="button" data-act="closeAlert">Close</button>
    </div>
  </div>`;
}

/* ---------- Render ---------- */
const app = document.getElementById('app');

function render(focusAct) {
  const v = compute();
  const chips = v.full ? CHIPS : CHIPS.concat([{ key: 'conf', label: 'Confidence' }]);

  app.innerHTML = `
  <div class="app">
    <header>
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#F26B2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 3 3 5"/></svg>
        <b>Firewatch</b>
        <span class="muted" style="font-size:14px">Cottonwood Creek Fire District</span>
      </div>
      <div class="modes" role="group" aria-label="Dashboard view">
        <button type="button" class="${!v.full ? 'on' : ''}" aria-pressed="${!v.full}" data-act="mode:simple">Simple</button>
        <button type="button" class="${v.full ? 'on' : ''}" aria-pressed="${v.full}" data-act="mode:full">Full</button>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="flag">Red flag warning</span>
        <span class="muted" style="font-size:13px">Hot, dry and windy: fires spread fast today</span>
      </div>
      <div class="weather">
        <div><span class="muted">Wind </span><b>S 35, gusts 55</b></div>
        <div><span class="muted">Humidity </span><b>11%</b></div>
        <div><span class="muted">Temp </span><b>78°F</b></div>
        <div><span class="muted">Rain </span><b>none in 5 weeks</b></div>
      </div>
    </header>

    <section class="tiles" aria-label="Key numbers">
      ${v.tiles.map(t => `
        <div class="tile">
          <div class="tl">${t.label}</div>
          <div class="tv num" style="color:${t.color}">${t.value}<span> ${t.unit}</span></div>
          <div class="tn">${t.note}</div>
        </div>`).join('')}
    </section>

    <div class="body ${v.full ? 'full' : ''}">
      ${v.full ? asideHtml(v) : ''}
      <div class="mapwrap">
        <div class="toolbar">
          <span class="muted" style="font-size:13px;margin-right:4px">Show on map</span>
          ${chips.map(c => {
            const on = !!state.layers[c.key];
            return `<button type="button" class="chip ${on ? 'on' : ''}" aria-pressed="${on}" data-act="layer:${c.key}">${c.label}</button>`;
          }).join('')}
          <span class="sim">Simulated scenario, not live data</span>
        </div>

        <main class="map">
          ${mapSvg(v)}
          ${!v.full && state.layers.conf ? confCard(v) : ''}
          ${v.k === 3 && !state.alertClosed ? alertHtml() : ''}
        </main>

        <div class="legend">
          <span><i style="width:14px;height:10px;border:2px solid #F26B2E;background:#0E0C0A;border-radius:6px"></i>Fire, burned inside</span>
          <span><i style="width:14px;height:10px;border:1px dashed #F26B2E;background:rgba(242,107,46,0.18)"></i>Fire path, 30 and 60 min</span>
          <span><i style="width:9px;height:9px;background:#F2A65A;border:1.5px solid #F26B2E"></i>Home in the path</span>
          <span><i style="width:9px;height:9px;background:#EDE3CF"></i>Home, safe for now</span>
          <span><i style="width:14px;height:8px;background:#6EA8D6"></i>Water</span>
          <span><i style="width:14px;height:2px;background:#C9B98F"></i>Power line</span>
          <span><i style="width:14px;height:3px;background:#E8B04A"></i>Firebreak</span>
          <span><i style="width:14px;height:10px;border:1px dashed #EDE3CF"></i>District boundary</span>
        </div>

        <footer>
          <div class="controls">
            <button type="button" data-act="back">Back</button>
            <button type="button" class="play" data-act="play">${state.playing ? 'Pause' : 'Play'}</button>
            <button type="button" data-act="next">Next</button>
          </div>
          <div style="min-width:0">
            <div class="steps">
              ${STEPS.map((s, i) => `<button type="button" class="${i === v.k ? 'on' : i < v.k ? 'done' : ''}" aria-label="Go to ${s.time} pm" data-act="step:${i}">${s.time}</button>`).join('')}
            </div>
            <div class="caption">${v.now.caption}</div>
            <div class="real">What really happened at ${v.now.time}: ${v.now.real}</div>
          </div>
          <div class="compare">
            <span></span>
            <span style="font-size:12px;font-weight:600;color:var(--fire)">Firewatch</span>
            <span class="muted" style="font-size:12px">Real day</span>
            ${v.compare.map(c => `
              <span class="muted">${c.label}</span>
              <span style="font-weight:600;color:${c.color}">${c.ours}</span>
              <span class="muted">${c.real}</span>`).join('')}
          </div>
        </footer>
      </div>
    </div>
  </div>`;

  if (focusAct) {
    const el = app.querySelector(`[data-act="${focusAct}"]`);
    if (el) el.focus();
  }
}

/* ---------- Actions ---------- */
function stopTimer() {
  if (timer) { clearInterval(timer); timer = null; }
  state.playing = false;
}

function goTo(i) {
  state.step = Math.max(0, Math.min(STEPS.length - 1, i));
  state.alertClosed = false;
  state.actionMsg = '';
}

function togglePlay() {
  if (state.playing) { stopTimer(); return; }
  if (state.step >= STEPS.length - 1) goTo(0);
  state.playing = true;
  timer = setInterval(() => {
    if (state.step >= STEPS.length - 1) { stopTimer(); render(); return; }
    goTo(state.step + 1);
    render();
  }, 2800);
}

app.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const [name, arg] = act.split(':');

  if (name === 'mode') state.mode = arg;
  else if (name === 'layer') state.layers[arg] = !state.layers[arg];
  else if (name === 'tab') state.tab = arg;
  else if (name === 'step') { stopTimer(); goTo(Number(arg)); }
  else if (name === 'back') { stopTimer(); goTo(state.step - 1); }
  else if (name === 'next') { stopTimer(); goTo(state.step + 1); }
  else if (name === 'play') togglePlay();
  else if (name === 'closeAlert') state.alertClosed = true;
  else if (name === 'ask') state.actionMsg = 'Texted 4 people within 5 miles: “Can you see smoke? Reply YES or NO.”';
  else if (name === 'false') state.actionMsg = 'Marked as a false alarm. Alerts stop.';

  render(act);
});

render();
</script>
</body>
</html>
